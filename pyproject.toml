[tool.poetry]
name = "ai-video-editor"
version = "0.1.0"
description = "Local-first AI video editing app with automated clip ingestion, transcription, retrieval, and rendering."
authors = ["ai-video-editor <noreply@example.com>"]
readme = "README.md"
packages = [
  { include = "backend" }
]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
fastapi = "^0.111.0"
uvicorn = { version = "^0.29.0", extras = ["standard"] }
pydantic = "^2.10.0"
setuptools = "<82"
wheel = "*"
openai-whisper = "20250625"
sentence-transformers = "5.4.0"
faiss-cpu = "*"
psycopg2-binary = "*"
sqlalchemy = "^2.0.0"
python-dotenv = "^1.0.0"
ffmpeg-python = "^0.2.0"
typer = "^0.12.3"
opencv-python = "*"
pillow = "*"
torch = "2.11.0"
torchvision = "0.26.0"
python-multipart = "*"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^24.9.0"
flake8 = "^6.1.0"

[tool.poetry.scripts]
ai-video-editor = "backend.main:app"

[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"
