# Configures the backend project.
# https://moonrepo.dev/docs/config/project

language: "python"

# Tasks to run within the project.
tasks:
  install:
    script: "cd .. && ./.venv/bin/poetry install"

  dev:
    script: "cd .. && ./.venv/bin/poetry run python backend/main.py"
    deps:
      - "install"

  web:
    script: "cd .. && ./.venv/bin/poetry run uvicorn backend.api.server:app --reload --host 0.0.0.0 --port 8000"
    deps:
      - "install"

  test:
    script: "cd .. && ./.venv/bin/poetry run pytest backend/tests"
    deps:
      - "install"

  lint:
    script: "cd .. && ./.venv/bin/poetry run flake8 backend/"
    deps:
      - "install"

  format:
    script: "cd .. && ./.venv/bin/poetry run black backend/"
    deps:
      - "install"
